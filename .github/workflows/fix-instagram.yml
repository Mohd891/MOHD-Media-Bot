name: Fix Instagram downloader

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch bot.py
        env:
          PATCH_B64: \حجم الفيديو أكبر من حد Telegram المسموح للبوت (50 MB).IikKICAgIHN0YWJsZSA9IERPV05MT0FEX0RJUyAvIGYicmVzdWx0X3t1dWlkNCgpLmhleH0ubXA0IgogICAgZmlsZW5hbWUucmVwbGFjZShzdGFibGUpCiAgICByZXR1cm4gc3RhYmxlLCAoaW5mbyBvciB7fSkuZ2V0KCJ0aXRsZSIpIG9yICJJbnN0YWdyYW0gUmVlbCIK'''
          python - <<'PY'
          import base64, os
          from pathlib import Path
          exec(base64.b64decode(os.environ['PATCH_B64']).decode('utf-8'))
          PY

      - name: Validate Python
        run: python -m py_compile bot.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: support authenticated Instagram reels"
          git push
