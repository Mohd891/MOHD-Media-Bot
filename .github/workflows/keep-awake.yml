name: Keep bot awake

# Backup for the in-app keep-awake ping: wakes the Render free instance
# if it ever falls asleep. GitHub may delay scheduled runs by several minutes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping bot
        run: curl -fsS --max-time 90 https://mohd-media-bot.onrender.com/ || true
