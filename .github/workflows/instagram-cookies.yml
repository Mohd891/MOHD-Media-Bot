name: Patch Instagram cookie support

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot.py
        env:
          PATCH_B64: 
        run: |
          python -c "import base64,os; exec(base64.b64decode(os.environ['PATCH_B64']).decode())"
          python -m py_compile bot.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: support Instagram authenticated cookies"
          git push
